<div id="tbs" aria-label="三星体混沌轨道动画"><style>#tbs{font-family:inherit;color:var(--foreground);width:100%;max-width:736px}#tbs .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}#tbs .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#tbs button{font:inherit;font-size:13px;color:var(--foreground);background:transparent;border:1px solid var(--border);padding:6px 11px;border-radius:8px;cursor:pointer}#tbs button:hover{background:var(--accent)}#tbs button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}#tbs label{font-size:13px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}#tbs input[type=range]{width:96px;accent-color:var(--primary)}#tbs canvas{display:block;width:100%;height:auto;aspect-ratio:1.8;border:1px solid var(--border);border-radius:12px;background:var(--background)}#tbs .cap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted-foreground)}#tbs .lg{display:flex;gap:12px}#tbs .lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}#tbs .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style><div class="bar"><div class="grp"><button id="tbs-play" type="button" aria-pressed="true">暂停</button><button id="tbs-new" type="button">换一组</button><label>速度<input id="tbs-spd" type="range" min="0.3" max="3" step="0.1" value="1.2" aria-label="播放速度"></label><label><input id="tbs-trail" type="checkbox" checked> 轨迹</label></div><span id="tbs-t" class="text-small">t = 0.0</span></div><canvas id="tbs-cv" role="img" aria-label="三个质量相近天体在牛顿引力下相互绕转的混沌轨道动画"></canvas><div class="cap"><span>牛顿引力 + 软化项 · 三体质量比 1 : 1 : 1</span><span class="lg" aria-hidden="true"><span><i style="background:var(--viz-series-1)"></i>A</span><span><i style="background:var(--viz-series-2)"></i>B</span><span><i style="background:var(--viz-series-3)"></i>C</span></span></div><p class="sr">动画演示三个质量相近的天体在相互引力作用下不断改变轨道、发生近距离掠过的混沌运动。</p><script>(function(){var root=document.getElementById('tbs'),cv=document.getElementById('tbs-cv'),g=cv.getContext('2d'),btnPlay=document.getElementById('tbs-play'),btnNew=document.getElementById('tbs-new'),spd=document.getElementById('tbs-spd'),trailBox=document.getElementById('tbs-trail'),tEl=document.getElementById('tbs-t');var COL=['--viz-series-1','--viz-series-2','--viz-series-3'];var G=1.0,SOFT=0.05,DT=0.0015,MAXTRAIL=900;var bodies=[],trails=[],t=0,run=true,last=0,acc=0,seed=7;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}function mkBody(ang,rad,sign){var v=Math.sqrt(G*0.9/rad);return{x:Math.cos(ang)*rad,y:Math.sin(ang)*rad,vx:-Math.sin(ang)*v*sign,vy:Math.cos(ang)*v*sign,m:1}}function reset(random){if(random){seed=(Math.random()*1e9)|0}bodies=[];trails=[];t=0;for(var i=0;i<3;i++){var b=mkBody(i*2.0944+rnd()*0.5,0.62+rnd()*0.16,(i%2?-1:1));b.vx+=(rnd()-0.5)*0.12;b.vy+=(rnd()-0.5)*0.12;bodies.push(b);trails.push([]);}var px=0,py=0,pvx=0,pvy=0;for(var k=0;k<3;k++){px+=bodies[k].x;py+=bodies[k].y;pvx+=bodies[k].vx;pvy+=bodies[k].vy}px/=3;py/=3;pvx/=3;pvy/=3;for(var k2=0;k2<3;k2++){bodies[k2].x-=px;bodies[k2].y-=py;bodies[k2].vx-=pvx;bodies[k2].vy-=pvy}}function accel(){var a=[{x:0,y:0},{x:0,y:0},{x:0,y:0}];for(var i=0;i<3;i++){for(var j=i+1;j<3;j++){var dx=bodies[j].x-bodies[i].x,dy=bodies[j].y-bodies[i].y,d2=dx*dx+dy*dy+SOFT*SOFT,inv=G/(d2*Math.sqrt(d2));a[i].x+=dx*inv*bodies[j].m;a[i].y+=dy*inv*bodies[j].m;a[j].x-=dx*inv*bodies[i].m;a[j].y-=dy*inv*bodies[i].m}}return a}function step(){var a=accel();for(var i=0;i<3;i++){var b=bodies[i];b.vx+=a[i].x*DT/2;b.vy+=a[i].y*DT/2;b.x+=b.vx*DT;b.y+=b.vy*DT;var a2=accel();b.vx+=a2[i].x*DT/2;b.vy+=a2[i].y*DT/2}t+=DT;for(var j=0;j<3;j++){var tr=trails[j];tr.push(bodies[j].x,bodies[j].y);if(tr.length>MAXTRAIL*2)tr.splice(0,tr.length-MAXTRAIL*2)}}function css(n){return getComputedStyle(root).getPropertyValue(n).trim()}function draw(){var w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;g.clearRect(0,0,w,h);g.fillStyle=css('--background')||'transparent';g.fillRect(0,0,w,h);var scale=Math.min(w/2.6,h/1.9)*1.35,cx=w/2,cy=h/2;g.strokeStyle=css('--border');g.globalAlpha=0.35;g.lineWidth=1;g.beginPath();g.arc(cx,cy,Math.min(w,h)*0.42,0,6.284);g.stroke();g.globalAlpha=1;if(trailBox.checked){for(var i=0;i<3;i++){var tr=trails[i];if(tr.length<4)continue;g.beginPath();g.moveTo(cx+tr[0]*scale,cy+tr[1]*scale);for(var k=2;k<tr.length;k+=2){g.lineTo(cx+tr[k]*scale,cy+tr[k+1]*scale)}g.strokeStyle=css(COL[i]);g.globalAlpha=0.4;g.lineWidth=1.4;g.stroke();g.globalAlpha=1}}for(var n=0;n<3;n++){var b=bodies[n],px=cx+b.x*scale,py=cy+b.y*scale,col=css(COL[n]);var grd=g.createRadialGradient(px,py,0,px,py,16);grd.addColorStop(0,col);grd.addColorStop(1,'transparent');g.globalAlpha=0.5;g.fillStyle=grd;g.beginPath();g.arc(px,py,16,0,6.284);g.fill();g.globalAlpha=1;g.fillStyle=col;g.beginPath();g.arc(px,py,6.5,0,6.284);g.fill();g.fillStyle=css('--foreground');g.font='500 12px system-ui,sans-serif';g.fillText('ABC'.charAt(n),px+11,py-9)}tEl.textContent='t = '+t.toFixed(1)}function resize(){var d=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*d);cv.height=Math.round(h*d);g.setTransform(d,0,0,d,0,0)}var raf=0;function loop(now){raf=requestAnimationFrame(loop);if(!last)last=now;var ms=Math.min(now-last,50);last=now;if(run){acc+=ms*parseFloat(spd.value);var steps=Math.min(600,Math.floor(acc/6));acc-=steps*6;for(var i=0;i<steps;i++)step()}draw()}btnPlay.addEventListener('click',function(){run=!run;btnPlay.textContent=run?'暂停':'播放';btnPlay.setAttribute('aria-pressed',String(run));last=0});btnNew.addEventListener('click',function(){reset(true);acc=0;last=0});trailBox.addEventListener('change',function(){draw()});window.addEventListener('resize',resize);reset(false);resize();requestAnimationFrame(loop)})();</script></div>
